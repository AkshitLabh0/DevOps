apiVersion: apps/v1
kind: Deployment
metadata:
  name: happy-paws
  labels:
    app: happy-paws
spec:
  replicas: 2
  selector:
    matchLabels:
      app: happy-paws
  template:
    metadata:
      labels:
        app: happy-paws
    spec:
      containers:
      - name: happy-paws
        image: akshit0o/happy-paws:latest   # replaced by pipeline or set image via kubectl set image
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
