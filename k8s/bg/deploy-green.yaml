apiVersion: apps/v1
kind: Deployment
metadata:
  name: happy-paws-green
  namespace: happy-paws-bg
  labels:
    app: happy-paws
    track: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: happy-paws
      track: green
  template:
    metadata:
      labels:
        app: happy-paws
        track: green
    spec:
      containers:
      - name: happy-paws
        image: akshit0o/happy-paws:latest
        ports:
        - containerPort: 80
        readinessProbe: { httpGet: { path: "/", port: 80 }, initialDelaySeconds: 5, periodSeconds: 5 }
        livenessProbe:  { httpGet: { path: "/", port: 80 }, initialDelaySeconds: 15, periodSeconds: 20 }
